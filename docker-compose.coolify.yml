# Production stack for Coolify (Build Pack: Docker Compose, file: /docker-compose.coolify.yml).
#
# Traffic: browser -> Coolify proxy (80/443, TLS) -> frontend nginx :3939 -> /api -> api :8000
# Only the frontend is routed publicly; Postgres, Redis, api and worker stay on the internal network.
#
# Coolify magic variables (no manual setup needed):
#   SERVICE_FQDN_FRONTEND_3939  -> Coolify generates/assigns the domain and routes it to port 3939.
#                                  Override the domain in the UI (frontend -> Domains) if you have your own.
#   SERVICE_USER_POSTGRES / SERVICE_PASSWORD_POSTGRES -> generated once, URL-safe, persisted by Coolify.

x-backend-build: &backend-build
  context: .
  dockerfile: infrastructure/docker/backend.Dockerfile
  args: { EXTRAS: "" }

x-backend-env: &backend-env
  # "development" allows the offline fake AI providers. Switch to "production" in Coolify once
  # EDU3D_LLM_PROVIDER/EDU3D_THREE_D_PROVIDER and their API keys are set (enforced at startup).
  EDU3D_ENVIRONMENT: ${EDU3D_ENVIRONMENT:-development}
  EDU3D_DATABASE_URL: postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-edu3d}
  EDU3D_REDIS_URL: redis://redis:6379/0
  EDU3D_PUBLIC_BASE_URL: ${EDU3D_PUBLIC_BASE_URL:-https://dev.beyondbooks.no}
  EDU3D_CORS_ORIGINS: '${EDU3D_CORS_ORIGINS:-["https://dev.beyondbooks.no"]}'
  EDU3D_JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}  # Coolify-generated, persisted
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}  # set in Coolify; read by app/integrations/elevenlabs
  EDU3D_COOKIE_SECURE: ${EDU3D_COOKIE_SECURE:-true}  # served over HTTPS by the Coolify proxy
  EDU3D_OPEN_REGISTRATION: ${EDU3D_OPEN_REGISTRATION:-true}
  EDU3D_JOBS_RUN_INLINE: "false"
  EDU3D_LOG_FORMAT: ${EDU3D_LOG_FORMAT:-json}
  EDU3D_STORAGE_BACKEND: local
  EDU3D_LOCAL_STORAGE_DIR: /data/storage  # on the shared "storage" volume (api + worker)
  # AI providers: fake | anthropic | openai (LLM); fake | llm | tripo | meshy (3D)
  EDU3D_LLM_PROVIDER: ${EDU3D_LLM_PROVIDER:-fake}
  EDU3D_THREE_D_PROVIDER: ${EDU3D_THREE_D_PROVIDER:-fake}
  EDU3D_ANTHROPIC_API_KEY: ${EDU3D_ANTHROPIC_API_KEY:-}
  EDU3D_ANTHROPIC_MODEL: ${EDU3D_ANTHROPIC_MODEL:-claude-opus-5-5}
  EDU3D_OPENAI_API_KEY: ${EDU3D_OPENAI_API_KEY:-}
  EDU3D_OPENAI_MODEL: ${EDU3D_OPENAI_MODEL:-}
  # Demo data, loaded by the api on every start (idempotent: only what is missing is added):
  # the shared courses with their PDFs/3D models, the demo accounts behind the login page's
  # "Use the demo account" buttons, and analytics students. Set EDU3D_SEED_DEMO_DATA=false to stop.
  # Passwords (12+ characters) only apply when the account is created.
  EDU3D_SEED_DEMO_DATA: ${EDU3D_SEED_DEMO_DATA:-true}
  SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL:-teacher@example.com}
  SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-teacher-demo-123}
  SEED_STUDENT_EMAIL: ${SEED_STUDENT_EMAIL:-student@example.com}
  SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-student-demo-123}
  SEED_DEMO_STUDENTS: ${SEED_DEMO_STUDENTS:-50}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-edu3d}
    # Renamed from "pgdata": that volume was first initialized by the local compose file with
    # different credentials. A fresh name gives Postgres a clean init with the Coolify-generated ones.
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      # -h 127.0.0.1: TCP check, so the socket-only temp server used during first-boot init
      # (before Postgres restarts) is not mistaken for "ready".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: *backend-build
    restart: unless-stopped
    # Runs migrations (with retries, errors visible in this service's logs), then uvicorn.
    command: api-start
    environment: *backend-env
    volumes: [storage:/data]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: *backend-build
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend-env
    volumes: [storage:/data]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.prod.Dockerfile
      args:
        # Demo sign-in is on by default (set VITE_DEMO_LOGIN=false in Coolify to turn it off).
        # Accounts default to the ones the api seeds (SEED_TEACHER_* / SEED_STUDENT_* above);
        # if you change those, set these to the same "email:password".
        VITE_DEMO_LOGIN: ${VITE_DEMO_LOGIN:-true}
        VITE_DEMO_TEACHER: ${VITE_DEMO_TEACHER:-}
        VITE_DEMO_STUDENT: ${VITE_DEMO_STUDENT:-}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_FRONTEND_3939: ""  # Coolify: route the generated/assigned domain to container port 3939
    expose: ["3939"]
    # Not gated on api health: nginx resolves api per request, so a failing api
    # never blocks the deploy (and its logs stay visible in Coolify).
    depends_on: [api]

volumes:
  postgres-data:
  redisdata:
  storage:
