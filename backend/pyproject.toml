[project]
name = "edu3d-backend"
version = "0.1.0"
description = "Edu3D AI backend — FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "celery>=5.4",
  "redis>=5.0",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "pymupdf>=1.24",
  "boto3>=1.35",
  "openai>=1.50",
  "anthropic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "boto3", "botocore.*", "pymupdf"]
ignore_missing_imports = true
