name: Run a command on the instance over SSM
description: >
  Sends one shell command to the EC2 instance through AWS Systems Manager (no SSH, no keys,
  no open port), waits for it, prints its output, and fails when the command fails.
inputs:
  instance-id: { description: EC2 instance id, required: true }
  command: { description: Shell command to run as root, required: true }
  timeout-seconds: { description: Max run time, default: "1800" }
  comment: { description: Shown in the SSM console, default: "github-actions" }
outputs:
  stdout: { description: Last 2000 chars of standard output, value: "${{ steps.wait.outputs.stdout }}" }
  status: { description: SSM status (Success, Failed, TimedOut, ...), value: "${{ steps.wait.outputs.status }}" }
runs:
  using: composite
  steps:
    - name: Wait until the instance is managed by SSM
      shell: bash
      env: { INSTANCE: "${{ inputs.instance-id }}" }
      run: |
        for _ in $(seq 1 60); do
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE" --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$state" = stopped ] || [ "$state" = stopping ]; then
            echo "instance is $state: starting it"; aws ec2 start-instances --instance-ids "$INSTANCE" >/dev/null
          fi
          ping=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE" --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
          [ "$ping" = Online ] && { echo "instance online"; exit 0; }
          echo "instance state=$state ssm=$ping; waiting"; sleep 10
        done
        echo "::error::instance never came online in SSM"; exit 1
    - name: Send command
      id: send
      shell: bash
      env:
        INSTANCE: "${{ inputs.instance-id }}"
        COMMAND: "${{ inputs.command }}"
        TIMEOUT: "${{ inputs.timeout-seconds }}"
        COMMENT: "${{ inputs.comment }}"
      run: |
        id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
              --comment "$COMMENT" --timeout-seconds 600 \
              --parameters "$(jq -cn --arg c "$COMMAND" --arg t "$TIMEOUT" '{commands:[$c], executionTimeout:[$t]}')" \
              --query 'Command.CommandId' --output text)
        echo "command-id=$id" >> "$GITHUB_OUTPUT"; echo "sent $id: $COMMAND"
    - name: Wait for the result
      id: wait
      shell: bash
      env:
        INSTANCE: "${{ inputs.instance-id }}"
        CMD_ID: "${{ steps.send.outputs.command-id }}"
        TIMEOUT: "${{ inputs.timeout-seconds }}"
      run: |
        deadline=$(( $(date +%s) + TIMEOUT + 120 ))
        while :; do
          status=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
          case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          [ "$(date +%s)" -gt "$deadline" ] && { status=TimedOut; break; }
          sleep 15
        done
        out=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text 2>/dev/null || true)
        err=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardErrorContent --output text 2>/dev/null || true)
        echo "== stdout"; echo "$out"; echo "== stderr (last lines)"; echo "$err" | tail -40
        { echo "stdout<<EOF_SSM"; echo "$out" | tail -c 2000; echo "EOF_SSM"; echo "status=$status"; } >> "$GITHUB_OUTPUT"
        { echo "### SSM: $status"; echo '```'; echo "$out" | tail -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        [ "$status" = Success ] || { echo "::error::command finished with status $status"; exit 1; }
