name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.prod.Dockerfile
          load: true
          tags: edu3d-backend:smoke
      - name: Smoke test backend image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e EDU3D_ENVIRONMENT=development -e EDU3D_DATABASE_URL=sqlite:////tmp/smoke.db \
            -e EDU3D_JOBS_RUN_INLINE=true -e EDU3D_LOCAL_STORAGE_DIR=/tmp/storage \
            edu3d-backend:smoke sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health/ready && break; sleep 2; done
          curl -sf localhost:8000/api/v1/health/ready
          docker logs api | tail -20
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.prod.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend.prod.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
