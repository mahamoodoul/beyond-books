server {
    listen 3939;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;
    server_tokens off;

    # Security headers (mirrors infrastructure/docker/nginx.conf.template).
    # CSP: 'wasm-unsafe-eval' lets the 3D heart's meshopt decoder (WebAssembly) run, without allowing JS eval;
    # Google Fonts (Inter, Space Grotesk) need fonts.googleapis.com (CSS) and fonts.gstatic.com (font files).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Re-resolve the backend via Docker's DNS so a recreated api container
    # (new IP after a redeploy) doesn't leave nginx proxying to a dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # API -> FastAPI backend (service name "api" on the compose network)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Hashed build assets: cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
